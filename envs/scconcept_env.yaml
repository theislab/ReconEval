name: reconeval-scconcept
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numpy=2.1.*
  - pandas=2.3.*
  - scipy=1.14.*
  - scikit-learn=1.7.*
  - matplotlib=3.10.*
  - tqdm=4.67.*
  - pyyaml=6.0.*
  - anndata=0.11.*
  - scanpy=1.11.*
  - h5py=3.15.*
  - zarr=2.18.*
  - numcodecs=0.13.*
  - dask=2026.1.*
  - dask-cuda=26.2.*
  # scConcept's Transformer decoder uses FlashAttention (Ampere+ GPUs)
  - pytorch=2.6.*
  - pytorch-cuda=12.4
  - torchvision=0.21.0
  - lightning=2.6.*
  - torchmetrics=1.8.*
  - hydra-core=1.3.*
  - omegaconf=2.3.*
  - wandb=0.20.*
  - pip
  - pip:
      - lamindb==1.6.2
      - lamindb-setup==1.6.1
      - einops==0.8.1
      - torchdata==0.11.0
      - huggingface-hub==1.2.3
      # Install scConcept, lamin-dataloader v0.1.0 and FlashAttention with --no-deps;
      # the container does this in docker/setup.sh.
      - -e ..
