[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[project]
name = "reconeval"
description = "Benchmark for gene-expression reconstruction from single-cell latent representations"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [{name = "Theis Lab"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scanpy",
    "matplotlib",
    "tqdm",
    "decoupler",
    "omnipath",
    "pot",
    "zarr",
    "numcodecs",
    "omegaconf",
]
dynamic = ["version"]

[project.optional-dependencies]
# Deep-learning stack (torch etc.). Kept out of core so lightweight consumers
# — e.g. the OpenProblems metric/PCA Docker images — install a small, fast
# footprint. The dataloaders/models already guard these imports at runtime.
# Components that need them (autoencoder, scvi) install them explicitly.
dl = ["torch", "lightning", "scvi-tools", "dask", "geomloss"]
# GPU-only acceleration (RAPIDS/CUDA). Not installable on CPU-only hosts,
# so it is an opt-in extra rather than a core dependency; this keeps
# `pip install .` (and the OpenProblems Docker images) working on CPU.
gpu = ["cupy-cuda12x"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.1",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex>=2",
    "sphinxext-opengraph",
    "ipykernel",
    "ipython",
]
dev = [
    "pytest",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/theislab/ReconEval"
Documentation = "https://reconeval.readthedocs.io"
Source = "https://github.com/theislab/ReconEval"
Issues = "https://github.com/theislab/ReconEval/issues"

[tool.hatch.build.targets.wheel]
# The src-layout `packages` entry already maps `src/sc_reconstruction` to
# `sc_reconstruction/...` in the wheel. A `force-include` of the same path
# duplicates every file (e.g. `sc_reconstruction/__init__.py`) and makes the
# wheel build fail, which in turn breaks `pip install git+…/ReconEval`.
packages = ["src/sc_reconstruction"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"
